<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.11/index.global.min.js"></script>

<style>
  body { margin: 10px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  /* ★1日の高さ（調整ポイント） */
  .fc-daygrid-day-frame { min-height: 240px; }

  /* 時間非表示 */
  .fc-event-time { display: none; }

  /* 見やすさ */
  .fc-daygrid-event {
    white-space: normal;
    font-size: 12px;
    line-height: 1.2;
    padding: 2px 4px;
    border-radius: 4px;
  }

  .fc-event-title { white-space: normal; }
</style>
</head>

<body>
<div id="calendar"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {

  const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
    initialView: 'dayGridMonth',
    locale: 'ja',

    eventSources: [
      {
        url: 'https://aso-id.github.io/Weather-Monitoring-Schedule/aco_chill_camp_2026_schedule.ics'
        format: 'ics'
      }
    ],

    displayEventTime: false,
    dayMaxEventRows: false,
    expandRows: true,
    height: 'auto',

    eventOrder: 'title',

    /* 色分け（自由に変更） */
    eventDidMount: function(info) {
      const t = info.event.title;

      if (t.includes('LIVE')) info.el.style.backgroundColor = '#ff6b6b';
      else if (t.includes('イベント')) info.el.style.backgroundColor = '#4dabf7';
      else if (t.includes('休')) info.el.style.backgroundColor = '#ffd43b';
      else info.el.style.backgroundColor = '#adb5bd';
    }

  });

  calendar.render();
});
</script>

</body>
</html>
